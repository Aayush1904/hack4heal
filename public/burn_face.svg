<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" style="background:#e4dcd3; border-radius:12px;">
  <defs>
    <radialGradient id="chemGrad" cx="55%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#701210" />
      <stop offset="35%" stop-color="#9e2820" />
      <stop offset="70%" stop-color="#bf503b" />
      <stop offset="90%" stop-color="#d67b67" />
      <stop offset="100%" stop-color="#e4dcd3" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Head & Neck Contour -->
  <path d="M 220 70 Q 300 40 380 70 Q 420 180 400 280 Q 360 350 300 360 Q 240 350 200 280 Q 180 180 220 70 Z" fill="#d9c8bc" />
  <path d="M 240 350 L 220 440 L 380 440 L 360 350 Z" fill="#cfbbae" />
  <!-- Chemical Corrosive Burn Zones -->
  <path d="M 260 140 Q 380 120 390 220 Q 380 320 290 310 Q 250 260 260 140 Z" fill="url(#chemGrad)" />
  <ellipse cx="320" cy="200" rx="35" ry="45" fill="#4d0e0b" opacity="0.8" />
  <!-- Soot / Singeing indicator -->
  <circle cx="280" cy="260" r="12" fill="#262322" opacity="0.6"/>
  <circle cx="310" cy="275" r="10" fill="#262322" opacity="0.55"/>
  <!-- Status badges -->
