  <text x="30" y="38" fill="#ffffff" font-family="sans-serif" font-size="11">Face and airway</text>
  <rect x="20" y="405" width="280" height="25" rx="4" fill="#ffffff" opacity="0.9" />
  <text x="28" y="422" fill="#1c1c1e" font-family="sans-serif" font-size="10">Chemical burn, possible smoke injury</text>
</svg>
